<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>تسجيلة أسطورة البلوت أبو خالد</title>
<style>
  :root{
    --bg:#000;
    --card:#0c0c0d;
    --circle:#2b2b2e;
    --circle-line:#c9c9cd;
    --white:#f5f5f5;
    --muted:#9a9a9f;
    --line:#242427;
    --green:#38c06a;
    --red:#e06a6a;
    --gold:#d9b64e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;background:var(--bg)}
  body{
    font-family:"Segoe UI","Tahoma",sans-serif;color:var(--white);
    min-height:100vh;padding:14px 12px 40px;
  }
  .wrap{max-width:430px;margin:0 auto}

  .card{background:var(--card);border-radius:30px;padding:18px 18px 22px;box-shadow:0 20px 50px rgba(0,0,0,.6)}

  /* framed title */
  .titlebar{
    border:2px solid var(--gold);border-radius:16px;
    padding:12px 14px;text-align:center;margin-bottom:18px;
    background:linear-gradient(180deg,rgba(217,182,78,.10),rgba(217,182,78,.02));
  }
  .titlebar h1{
    margin:0;font-size:19px;font-weight:800;color:var(--gold);letter-spacing:.3px;
    line-height:1.35;
  }

  /* scores with logo in the middle */
  .scores{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;margin-bottom:8px}
  .side{text-align:center}
  .side .lbl{font-size:38px;font-weight:800;line-height:1}
  .side .val{font-size:40px;font-weight:400;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .midlogo{
    width:78px;height:78px;border-radius:50%;object-fit:cover;justify-self:center;
    border:3px solid var(--gold);box-shadow:0 0 0 3px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.5);
  }
  .crown{font-size:16px;height:16px;line-height:1}

  /* center pad */
  .pad{position:relative;height:250px;margin:6px 0 2px}
  .circle{
    position:absolute;top:60px;width:140px;height:140px;border-radius:50%;
    background:var(--circle);border:3px solid var(--circle-line);
    display:flex;align-items:center;justify-content:center;padding:0;cursor:text;
  }
  .circle.lahom{left:2px}
  .circle.lana{right:2px}
  .circle input{
    width:100%;height:100%;border:none;background:transparent;text-align:center;
    color:var(--white);font-size:40px;font-weight:700;outline:none;
    font-variant-numeric:tabular-nums;border-radius:50%;-webkit-user-select:text;user-select:text;
  }
  .circle input::placeholder{color:#7a7a7f}
  .calc{
    position:absolute;left:50%;top:22px;transform:translateX(-50%);
    width:96px;height:96px;border-radius:50%;background:var(--white);color:#111;
    border:none;font-size:26px;font-weight:800;cursor:pointer;z-index:2;
    box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .05s ease;
  }
  .calc:active{transform:translateX(-50%) scale(.96)}
  .pie{
    position:absolute;left:50%;top:150px;transform:translateX(-50%);
    width:40px;height:40px;border-radius:50%;background:var(--card);
    border:1px solid #3a3a3e;display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:3;font-size:18px;color:#cfcfd3;
  }

  /* actions */
  .acts{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:16px;margin:8px 0 6px}
  .lnk{background:none;border:none;font-size:16px;font-weight:700;cursor:pointer;padding:6px 2px}
  .lnk.new{color:var(--green);border-bottom:2px solid var(--green);justify-self:end}
  .lnk.undo{color:var(--red);border-bottom:2px solid var(--red);justify-self:start}

  /* table */
  .tbl{margin-top:14px}
  .trow{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
  .trow:last-child{border-bottom:1px solid var(--line)}
  .tcell{
    text-align:center;padding:14px 6px;font-size:22px;color:#e8e8ea;
    font-variant-numeric:tabular-nums;position:relative;
  }
  .tcell.lahom{border-inline-start:1px solid var(--line)}
  .tcell input{
    width:100%;border:none;background:transparent;text-align:center;color:#e8e8ea;
    font-size:22px;outline:none;font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text;
  }
  .hint{text-align:center;color:#55555a;font-size:12px;margin-top:16px}
</style>
</head>

        <div class="side">
          <div class="crown" id="crownL"></div>
          <div class="lbl">لهم</div>
          <div class="val" id="totLahom">0</div>
        </div>
      </div>

      <!-- center pad -->
      <div class="pad">
        <button class="calc" id="calcBtn">احسب</button>
        <div class="pie" id="pieBtn" title="الخط 152">◔</div>
        <label class="circle lahom">
          <input id="curLahom" type="number" inputmode="numeric" placeholder="0">
        </label>
        <label class="circle lana">
          <input id="curLana" type="number" inputmode="numeric" placeholder="0">
        </label>
      </div>

      <!-- actions -->
      <div class="acts">
        <button class="lnk new" id="newBtn">صكة جديدة</button>
        <button class="lnk undo" id="undoBtn">تراجع</button>
      </div>

      <!-- table -->
      <div class="tbl" id="tbl"></div>

      <div class="hint">اكتب نقاط كل فريق في الدائرة ثم اضغط «احسب» • الخط <span id="tgtTxt">152</span></div>
    </div>
  </div>

<script>
  const KEY="baloot_abukhaled_v3";
  const $=id=>document.getElementById(id);

  const state=load();
  function load(){
    try{const d=JSON.parse(localStorage.getItem(KEY));
      if(d&&Array.isArray(d.rounds))return d;}catch(e){}
    return {rounds:[],target:152};
  }
  function save(){localStorage.setItem(KEY,JSON.stringify(state));}

  function totals(){
    let a=0,b=0;
    state.rounds.forEach(r=>{a+=Number(r.lana)||0;b+=Number(r.lahom)||0;});
    return {a,b};
  }

  function render(){
    const {a,b}=totals();
    $("totLana").textContent=a;
    $("totLahom").textContent=b;
    $("tgtTxt").textContent=state.target;
    $("pieBtn").title="الخط "+state.target;

    // crown at target
    $("crownR").textContent = (a>=state.target && a>=b) ? "👑" : "";
    $("crownL").textContent = (b>=state.target && b>a) ? "👑" : "";

    // table (لنا يمين، لهم يسار)
    const tbl=$("tbl");tbl.innerHTML="";
    state.rounds.forEach((r,i)=>{
      const row=document.createElement("div");
      row.className="trow";
      row.innerHTML=`
        <div class="tcell lana"><input type="number" inputmode="numeric" value="${r.lana}" data-i="${i}" data-k="lana"></div>
        <div class="tcell lahom"><input type="number" inputmode="numeric" value="${r.lahom}" data-i="${i}" data-k="lahom"></div>`;
      tbl.appendChild(row);
    });
  }

  function calc(){
    const la=$("curLana").value.trim();
    const lh=$("curLahom").value.trim();
    if(la===""&&lh==="")return;
    state.rounds.push({lana:la===""?0:Number(la), lahom:lh===""?0:Number(lh)});
    $("curLana").value="";$("curLahom").value="";
    save();render();
    $("curLana").blur();$("curLahom").blur();
  }

  $("calcBtn").addEventListener("click",calc);
  $("curLana").addEventListener("keydown",e=>{if(e.key==="Enter")calc();});
  $("curLahom").addEventListener("keydown",e=>{if(e.key==="Enter")calc();});

  $("undoBtn").addEventListener("click",()=>{
    if(state.rounds.length){state.rounds.pop();save();render();}
  });

  $("newBtn").addEventListener("click",()=>{
    if(confirm("صكة جديدة؟ بيتم مسح كل الجولات.")){
      state.rounds=[];save();render();
    }
  });

  $("pieBtn").addEventListener("click",()=>{
    const t=prompt("رقم الخط (الهدف):", state.target);
    if(t!==null){const n=parseInt(t,10); if(n>0){state.target=n;save();render();}}
  });

  // edit table cells
  $("tbl").addEventListener("input",e=>{
    const i=e.target.dataset.i,k=e.target.dataset.k;
    if(i===undefined)return;
    state.rounds[i][k]=e.target.value===""?0:Number(e.target.value);
    save();
    const {a,b}=totals();$("totLana").textContent=a;$("totLahom").textContent=b;
    render();
  });

  render();
</script>
</body>
</html>
